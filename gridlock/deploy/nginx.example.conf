# Gridlock M1 — reverse proxy to Node on localhost:3010
# Copy to /etc/nginx/sites-available/gridlock, set server_name, enable, then:
#   sudo certbot --nginx -d rts.example.com

# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     '' close;
# }

server {
    listen 80;
    listen [::]:80;
    server_name rts.example.com;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

# After certbot, nginx should have a 443 server with these paths (do not invent certs):
# ssl_certificate     /etc/letsencrypt/live/rts.example.com/fullchain.pem;
# ssl_certificate_key /etc/letsencrypt/live/rts.example.com/privkey.pem;
# include /etc/letsencrypt/options-ssl-nginx.conf;
# ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
# Duplicate the location / block under that 443 server (same Upgrade headers).
# HTTP can then redirect: return 301 https://$host$request_uri;
